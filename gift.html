<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Gift 💝</title>
  <style>
    .gift-img {
      
  width: 100%;
  max-width: 360px;
  margin: 18px auto;
  display: block;
  border-radius: 18px;
  box-shadow: 0 12px 30px rgba(0,0,0,.2);
}

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #fff1f5, #ffe4e6);
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: #111827;
    }
    .card {
      width: min(720px, 100%);
      background: rgba(255,255,255,.8);
      border-radius: 24px;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 4vw, 42px); }
    p { margin: 0 0 18px; color: #6b7280; font-size: 16px; }

    .code {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .08em;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px dashed rgba(0,0,0,.2);
      background: rgba(255,255,255,.7);
      display: inline-block;
      user-select: all;
    }

    .hint { margin-top: 16px; font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">💖</h1>
    <p id="line">can't wait to see u 💐</p>
    <img src="IMG_6171.jpg" alt="Flowers for you" class="gift-img" />
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const date = params.get("date");
    const type = params.get("type");

    const line = document.getElementById("line");

    if (date && type) {
      line.textContent = `can't wait for our ${type.toLowerCase()} date on ${date} 💐`;
    } else if (date) {
      line.textContent = `can't wait to see u on ${date} 💐`;
    }
  </script>
</body>
</html>
