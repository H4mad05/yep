<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💌 for u</title>

  <!-- Curly font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #fff1f5;
      --bg2: #ffe4e6;
      --card: rgba(255,255,255,.75);
      --text: #111827;
      --muted: #6b7280;
      --romantic: #e11d48;
      --yes: #22c55e;
      --yes2: #16a34a;
      --no: #ef4444;
      --shadow: 0 20px 60px rgba(0,0,0,.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--text);
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.15;
      font-family: "Pacifico", cursive;
      font-weight: 400;
      font-style: italic;
      color: var(--romantic);
      text-shadow: 0 6px 18px rgba(225, 29, 72, 0.25);
      display: inline-block;
      transform: rotate(-2deg);
    }

    .cat-wrap {
      display: grid;
      place-items: center;
      margin: 4px auto 14px;
    }

    .cat-img {
      width: min(320px, 70vw);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 14px 18px rgba(0,0,0,.12));
      transform: rotate(-1.5deg);
      border-radius: 18px;
      user-select: none;
      pointer-events: none;
    }

    .bubble {
      position: relative;
      margin: 0 auto 18px;
      max-width: 420px;
      padding: 12px 16px;
      background: rgba(255,255,255,.92);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
      color: #9f1239;
      font-size: 15px;
    }
    .bubble::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 40px;
      width: 0;
      height: 0;
      border: 10px solid transparent;
      border-top-color: rgba(255,255,255,.92);
    }

    .play-area {
      position: relative;
      width: min(520px, 100%);
      height: 160px;
      margin: 10px auto 0;
    }

    .btn {
      border: 0;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, box-shadow .2s ease, filter .2s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      touch-action: manipulation;
      user-select: none;
    }
    .btn:active { transform: translateY(1px) scale(.99); }

    #yesBtn {
      background: linear-gradient(180deg, var(--yes), var(--yes2));
      color: white;
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(-120%);
    }

    #noBtn {
      background: linear-gradient(180deg, #fb7185, var(--no));
      color: white;
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(20%);
    }

    .hearts {
      position: absolute;
      inset: -40px;
      pointer-events: none;
      opacity: .35;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,0,80,.20), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(255,0,120,.16), transparent 32%),
        radial-gradient(circle at 40% 90%, rgba(255,0,90,.14), transparent 28%);
      filter: blur(2px);
    }

    /* Date picker step */
    .hidden { display: none; }

    .date-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 18px 0;
    }

    .date-btn {
      border: 1px solid rgba(225,29,72,.25);
      background: rgba(255,255,255,.9);
      color: var(--romantic);
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, background .2s ease;
    }
    .date-btn:hover { background: #fff; }
    .date-btn:active { transform: translateY(1px) scale(.98); }
    .date-btn.selected {
      background: var(--romantic);
      color: #fff;
    }

    .custom-date-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 6px;
    }

    .custom-date-row input[type="text"] {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.15);
      font-size: 15px;
      min-width: 200px;
    }

    .confirm-btn {
      background: linear-gradient(180deg, var(--yes), var(--yes2));
      color: white;
      border: 0;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .confirm-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    @media (max-width: 480px) {
      .play-area { height: 190px; }
    }
  </style>
</head>

<body>
  <main class="card" aria-live="polite">
    <div class="hearts"></div>

    <div id="askStep">
      <h1 id="question">may i go on a date with you, malaz? 🌹</h1>

      <div class="cat-wrap" aria-hidden="true">
        <img src="cat.jpeg" alt="Cute cat" class="cat-img">
      </div>

      <div class="bubble">
        if u manage to click <b>NO</b> i'll tell u smthn important 👀
      </div>

      <div class="play-area" id="playArea">
        <button class="btn" id="yesBtn" type="button">YES 💖</button>
        <button class="btn" id="noBtn" type="button">NO</button>
      </div>
    </div>

    <div id="dateStep" class="hidden">
      <h1 id="dateTitle">pick a day 💌</h1>
      <div class="date-grid" id="dateGrid">
        <button class="date-btn" data-date="August 8th">August 8th</button>
        <button class="date-btn" data-date="August 9th">August 9th</button>
        <button class="date-btn" data-date="August 10th">August 10th</button>
        <button class="date-btn" data-date="__custom__">I have another day in mind</button>
      </div>

      <div class="custom-date-row hidden" id="customDateRow">
        <input type="text" id="customDateInput" placeholder="what day works for u?" />
      </div>

      <button class="confirm-btn" id="confirmDateBtn" disabled>confirm 💖</button>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const name = params.get("name") || "malaz";

    const askStep = document.getElementById("askStep");
    const dateStep = document.getElementById("dateStep");
    const playArea = document.getElementById("playArea");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNoButtonAwayFromPointer(pointerX, pointerY) {
      const area = playArea.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const pad = 10;

      const maxX = area.width - btnRect.width - pad;
      const maxY = area.height - btnRect.height - pad;

      for (let i = 0; i < 12; i++) {
        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        const left = clamp(x, pad, maxX);
        const top  = clamp(y, pad, maxY);

        const newLeft = area.left + left;
        const newTop  = area.top + top;
        const newRight = newLeft + btnRect.width;
        const newBottom = newTop + btnRect.height;

        const pointerInside =
          pointerX >= newLeft && pointerX <= newRight &&
          pointerY >= newTop && pointerY <= newBottom;

        if (!pointerInside) {
          noBtn.style.left = `${left}px`;
          noBtn.style.top = `${top}px`;
          noBtn.style.transform = "none";
          return;
        }
      }

      noBtn.style.left = `${pad}px`;
      noBtn.style.top = `${pad}px`;
      noBtn.style.transform = "none";
    }

    const noMessages = [
      "try harder 😏",
      "so close 😭",
      "nahhh",
      "u sure??",
      "not happening 🙂",
      "nice try 😼",
      "keep trying 👀",
      "almost… jk 💀"
    ];
    let noIndex = 0;

    function setNoText() {
      noBtn.textContent = noMessages[noIndex % noMessages.length];
      noIndex++;
    }

    function dodge(e) {
      const px = e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0;
      const py = e.clientY ?? (e.touches && e.touches[0]?.clientY) ?? 0;
      moveNoButtonAwayFromPointer(px, py);
      setNoText();
    }

    noBtn.addEventListener("pointermove", dodge);
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dodge(e);
    });

    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      return false;
    });

    // Initial NO placement
    noBtn.style.left = "50%";
    noBtn.style.top = "78px";
    noBtn.style.transform = "translateX(20%)";

    // YES -> reveal date picker
    yesBtn.addEventListener("click", () => {
      askStep.classList.add("hidden");
      dateStep.classList.remove("hidden");
    });

    // Date picker
    const dateGrid = document.getElementById("dateGrid");
    const customDateRow = document.getElementById("customDateRow");
    const customDateInput = document.getElementById("customDateInput");
    const confirmDateBtn = document.getElementById("confirmDateBtn");

    let selectedDate = null;

    dateGrid.addEventListener("click", (e) => {
      const btn = e.target.closest(".date-btn");
      if (!btn) return;

      dateGrid.querySelectorAll(".date-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");

      if (btn.dataset.date === "__custom__") {
        customDateRow.classList.remove("hidden");
        customDateInput.focus();
        selectedDate = customDateInput.value.trim() || null;
      } else {
        customDateRow.classList.add("hidden");
        selectedDate = btn.dataset.date;
      }

      confirmDateBtn.disabled = !selectedDate;
    });

    customDateInput.addEventListener("input", () => {
      selectedDate = customDateInput.value.trim() || null;
      confirmDateBtn.disabled = !selectedDate;
    });

    confirmDateBtn.addEventListener("click", () => {
      if (!selectedDate) return;
      const next = new URL("gift.html", location.href);
      next.searchParams.set("name", name);
      next.searchParams.set("date", selectedDate);
      location.href = next.toString();
    });
  </script>
</body>
</html>
